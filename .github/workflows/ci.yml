name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the production process in Chromium
        run: npm run test:e2e
        env:
          COMMITCRED_PRODUCTION_TEST: "1"
          COMMITCRED_SMART_UI_TEST: "1"
          # Synthetic SEO fixture used only by this local CI process.
          COMMITCRED_EXPECTED_ORIGIN: https://commitcred-ci-fixture.dev
      - run: npm audit --omit=dev --audit-level=high
